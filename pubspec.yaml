name: reframe_camera
description: "reFrame ePaper camera app for Android with Spectra 6 e-ink dithering simulation."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+1
  image: ^4.2.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  image_gallery_saver_plus: ^3.0.4
  share_plus: ^10.0.2
  cupertino_icons: ^1.0.8
  sensors_plus: ^6.1.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
